<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A57A"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Kitap gövdesi -->
  <rect x="96" y="128" width="320" height="256" rx="18" fill="none" stroke="url(#gold)" stroke-width="16"/>

  <!-- Cilt çizgisi (orta) -->
  <line x1="256" y1="136" x2="256" y2="376" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- Sol sayfa satırları -->
  <line x1="120" y1="192" x2="234" y2="192" stroke="#C4956A" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="220" x2="234" y2="220" stroke="#C4956A" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="248" x2="234" y2="248" stroke="#C4956A" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="120" y1="276" x2="200" y2="276" stroke="#C4956A" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Sağ sayfa — ORP vurgulu R harfi -->
  <text x="296" y="310" font-family="Georgia, serif" font-size="130" font-weight="700" fill="#F5F0E8" opacity="0.92" text-anchor="middle">R</text>
  <!-- ORP kırmızı nokta -->
  <circle cx="296" cy="232" r="10" fill="#E05252"/>

  <!-- Alt ince çizgi (dekoratif) -->
  <line x1="156" y1="400" x2="356" y2="400" stroke="#C4956A" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
</svg>
